services:
  db:
    image: postgres:17                # imagen oficial de PostgreSQL, versión 17
    container_name: stockflow-db      # nombre fijo para referirnos al contenedor
    environment:                      # variables que la imagen usa para configurarse
      POSTGRES_USER: ${POSTGRES_USER}         # ${...} se lee del archivo .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                   # puerto de tu PC : puerto del contenedor
    volumes:
      - pgdata:/var/lib/postgresql/data   # los datos se guardan en el volumen

volumes:
  pgdata:                             # Docker crea y administra este volumen